[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-kernel"
version = "0.1.0"
description = "An independently implemented headless coding-agent kernel"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ev3rGan" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agent-kernel", "coding-agent", "llm", "swe-bench"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/Ev3rGan/coding-agent-kernel"
Issues = "https://github.com/Ev3rGan/coding-agent-kernel/issues"
Repository = "https://github.com/Ev3rGan/coding-agent-kernel"

[project.optional-dependencies]
swebench = ["swebench==5.0.2"]
dev = [
    "build>=1.2",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
